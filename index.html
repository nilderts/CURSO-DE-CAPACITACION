<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registro de Participantes</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">
            Registro de Participantes
        </h1>
        <form id="formParticipante">
            <div class="row">
                <div class="col-md-6">
                    <label for="tipoDocumento" class="form-label">
                        Tipo de documento
                    </label>
                    <select id="tipoDocumento" class="form-select" required>
                        <option value="">
                            Seleccione...
                        </option>
                        <option value="DNI">
                            DNI
                        </option>
                        <option value="CE">
                            Carnet de extranjería
                        </option>
                        <option value="OTRO">
                            Otro
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label
                        for="numeroDocumento"
                        class="form-label">
                        Número de documento
                    </label>
                    <input
                        type="text"
                        id="numeroDocumento"
                        class="form-control"
                        maxlength="12"
                        required>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label
                        for="nombres"
                        class="form-label">
                        Nombres
                    </label>
                    <input
                        type="text"
                        id="nombres"
                        class="form-control"
                        required>
                </div>
                <div class="col-md-6">
                    <label
                        for="apellidos"
                        class="form-label">
                        Apellidos
                    </label>
                    <input
                        type="text"
                        id="apellidos"
                        class="form-control"
                        required>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label
                        for="tipoParticipante"
                        class="form-label">
                        Tipo de participante
                    </label>
                    <select
                        id="tipoParticipante"
                        class="form-select"
                        required>
                        <option value="">
                            Seleccione...
                        </option>
                        <option value="Estudiante">
                            Estudiante
                        </option>
                        <option value="Egresado">
                            Egresado
                        </option>
                        <option value="Externo">
                            Externo
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label
                        for="correo"
                        class="form-label">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        placeholder="ejemplo@gmail.com"
                        required>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button
                        type="submit"
                        class="btn btn-outline-primary">
                        Registrar
                    </button>
                    <button
                        type="reset"
                        class="btn btn-secondary">
                        Limpiar
                    </button>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-12"> 
                    <h2>Participantes registrados</h2> 
                    <table class="table">
                        <thead>
                            <tr>
                            <th scope="col">Documento</th>
                            <th scope="col">Nombres</th>
                            <th scope="col">Apellidos</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Correo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaParticipantes">
                            
                        </tbody>
                        </table>
                </div>
            </div>
        </form>
    </div>

    <!-- Cargamos JavaScript de Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
